<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevPath - Login</title>
    <link rel="stylesheet" href="styles/loginStyle.css">
</head>

<body>
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">💻</div>
            <h1>DevPath</h1>
            <p>Encuentra tu especialización ideal</p>
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm" style="display: block;">
            <div class="input-group">
                <input type="email" class="input-field" placeholder="Correo electrónico" required>
            </div>
            <div class="input-group">
                <input type="password" class="input-field" placeholder="Contraseña" required>
            </div>
            <div class="input-group">
                <button type="submit" class="btn btn-primary">
                    Iniciar Sesión
                </button>
                <button type="button" onclick="showRegisterForm()" class="btn btn-secondary">
                    Registrarse
                </button>
            </div>
            <div id="error-message" style="color: #ff6b6b; text-align: center; margin-top: 10px; display: none;"></div>
        </form>

        <!-- REGISTER FORM (OCULTO INICIALMENTE) -->
        <form id="registerForm" style="display: none;">
            <!-- ✨ NOMBRE -->
            <div class="input-group">
                <input type="text" id="register-nombre" class="input-field" placeholder="Nombre completo" required>
            </div>

            <!-- ✨ EMAIL -->
            <div class="input-group">
                <input type="email" id="register-email" class="input-field" placeholder="Correo electrónico" required>
            </div>

            <!-- ✨ CONTRASEÑA -->
            <div class="input-group">
                <input type="password" id="register-password" class="input-field"
                    placeholder="Contraseña (mínimo 6 caracteres)" required>
            </div>

            <!-- ✨ DNI -->
            <div class="input-group">
                <input type="text" id="register-dni" class="input-field" placeholder="DNI (8 dígitos)" maxlength="8"
                    pattern="[0-9]{8}" required>
            </div>

            <!-- ✨ CIUDAD -->
            <div class="input-group">
                <select id="register-ciudad" class="input-field" required>
                    <option value="">Seleccione una ciudad</option>
                </select>
            </div>

            <!-- BOTONES -->
            <div class="input-group">
                <button type="submit" class="btn btn-primary">
                    Crear Cuenta
                </button>
                <button type="button" onclick="showLoginForm()" class="btn btn-secondary">
                    Ya tengo cuenta
                </button>
            </div>

            <div id="register-error-message"
                style="color: #ff6b6b; text-align: center; margin-top: 10px; display: none;"></div>
        </form>



        <!-- Enlaces de navegación BLOQUEADOS desde login -->
        <div
            style="text-align: center; margin-top: 30px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.2);">
            <p style="color: rgba(255,255,255,0.6); font-size: 14px; margin-bottom: 10px;">Vista previa de pantallas:
            </p>
            <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                <a href="index.html" style="color: #00d4ff; font-size: 12px; text-decoration: none;">Login</a>
                <a href="#" onclick="blockNavigation('cuestionario.html')"
                    style="color: rgba(255,255,255,0.6); font-size: 12px; text-decoration: none; cursor: pointer;">Cuestionario</a>
                <a href="#" onclick="blockNavigation('recomendacion.html')"
                    style="color: rgba(255,255,255,0.6); font-size: 12px; text-decoration: none; cursor: pointer;">Recomendación</a>
                <a href="#" onclick="blockNavigation('ruta.html')"
                    style="color: rgba(255,255,255,0.6); font-size: 12px; text-decoration: none; cursor: pointer;">Ruta</a>
            </div>
            <p style="color: rgba(255,255,255,0.4); font-size: 11px; margin-top: 8px; font-style: italic;">
                🔒 Debes iniciar sesión para acceder a estas páginas
            </p>
        </div>
    </div>

    <script src="js/auth.js"></script>

    <script>
        function blockNavigation(page) {
            alert('❌ Acceso denegado\n\nDebes iniciar sesión para acceder a ' + page.replace('.html', ''));
        }
    </script>
</body>

</html>

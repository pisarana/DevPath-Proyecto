<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevPath - Cuestionario</title>
    <link rel="stylesheet" href="styles/cuestionarioStyle.css">
    <link rel="stylesheet" href="styles/navbar.css">
</head>

<body>
    <div id="navbar-container"></div>

    <div class="quiz-container" style="margin-top: 80px;">


        <div class="container">
            <div class="header">
                <h1>Cuestionario de Orientación</h1>
                <p id="questionCounter">Pregunta 1 de 7</p>


            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressBar"></div>
            </div>

            <div class="question-card">
                <div class="question-icon" id="questionIcon">🧠</div>
                <h2 class="question-title" id="questionTitle">Cargando pregunta...</h2>

                <div class="options" id="optionsContainer">
                    <!-- Las opciones se generarán automáticamente por JavaScript -->
                </div>

                <div class="navigation" id="navigationButtons">
                    <a href="#" onclick="confirmLogout()" class="btn btn-secondary">← Volver al Login</a>
                    <span></span>
                </div>

                <!-- Enlaces de navegación PROTEGIDOS -->
                <div class="demo-nav">
                    <p>Navegación (solo con sesión activa):</p>
                    <div>
                        <a href="#" onclick="confirmLogout()">Login</a>
                        <a href="cuestionario.html" class="active">Cuestionario</a>
                        <a href="#" onclick="navigateProtected('recomendacion.html')">Recomendación</a>
                        <a href="#" onclick="navigateProtected('ruta.html')">Ruta</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/sessions.js"></script>

    <script src="js/navbar.js"></script>

    <script src="js/quiz.js"></script>

</body>

</html>

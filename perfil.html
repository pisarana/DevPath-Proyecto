<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - DevPath</title>
    <link rel="stylesheet" href="styles/perfilStyle.css">
    <link rel="stylesheet" href="styles/navbar.css">
    <link rel="stylesheet" href="styles/notifications.css">
    <link rel="stylesheet" href="styles/modal.css">
</head>
<body>
    <!-- NAVBAR -->
    <div id="navbar-container"></div>

    <div class="profile-container" style="margin-top: 100px;">
        <!-- ❌ ELIMINAR ESTE HEADER - Ya tienes navbar arriba -->
        <!-- <div class="profile-header">...</div> -->

        <!-- Resumen del perfil (modo vista) -->
        <div id="profile-view" class="profile-view">
            <div class="profile-card">
                <div class="profile-avatar">
                    <div class="avatar-circle">
                        <span id="avatar-initials">MC</span>
                    </div>
                </div>

                <div class="profile-info">
                    <h2 id="view-nombre">Cargando...</h2>
                    <p class="profile-email" id="view-email">email@example.com</p>
                    <p class="profile-member-since">
                        Miembro desde: <span id="view-fecha-registro">--</span>
                    </p>
                </div>

                <!-- ESTADÍSTICAS -->
                <div class="profile-stats fade-in">
                    <h3 class="stats-title">📊 Mis Estadísticas</h3>
                    <div class="stats-grid">
                        <div class="stat-box">
                            <div class="stat-icon">📝</div>
                            <div class="stat-info">
                                <span class="stat-value" id="stat-quiz-count">-</span>
                                <span class="stat-label">Cuestionarios</span>
                            </div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-icon">🎯</div>
                            <div class="stat-info">
                                <span class="stat-value" id="stat-track">-</span>
                                <span class="stat-label">Especialización</span>
                            </div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-icon">⏱️</div>
                            <div class="stat-info">
                                <span class="stat-value" id="stat-days">-</span>
                                <span class="stat-label">Días Activo</span>
                            </div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-icon">🌟</div>
                            <div class="stat-info">
                                <span class="stat-value" id="stat-progress">0%</span>
                                <span class="stat-label">Progreso</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="profile-details">
                    <div class="detail-item">
                        <span class="detail-label">📧 Email:</span>
                        <span class="detail-value" id="view-email-detail">--</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">🆔 DNI:</span>
                        <span class="detail-value" id="view-dni">--</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">🌎 Ciudad:</span>
                        <span class="detail-value" id="view-ciudad">--</span>
                    </div>
                </div>

                <button onclick="showEditMode()" class="btn-primary btn-edit">
                    ✏️ Editar Perfil
                </button>
            </div>
        </div>

        <!-- Formulario de edición (oculto por defecto) -->
        <div id="profile-edit" class="profile-edit" style="display: none;">
            <div class="profile-card">
                <h2>✏️ Editar Perfil</h2>

                <form id="editProfileForm">
                    <div class="form-group">
                        <label>Nombre Completo</label>
                        <input type="text" id="edit-nombre" class="input-field" required>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="edit-email" class="input-field" required>
                    </div>

                    <div class="form-group">
                        <label>DNI</label>
                        <input type="text" id="edit-dni" class="input-field" maxlength="8" pattern="[0-9]{8}" required>
                    </div>

                    <div class="form-group">
                        <label>Ciudad</label>
                        <select id="edit-ciudad" class="input-field" required>
                            <option value="">Cargando ciudades...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Nueva Contraseña (opcional)</label>
                        <input type="password" id="edit-password" class="input-field" placeholder="Dejar vacío para no cambiar">
                        <small style="color: #999;">Solo completa si deseas cambiar tu contraseña</small>
                    </div>

                    <div id="edit-error-message" class="error-message" style="display: none;"></div>
                    <div id="edit-success-message" class="success-message" style="display: none;"></div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">
                            💾 Guardar Cambios
                        </button>
                        <button type="button" onclick="cancelEdit()" class="btn-secondary">
                            ❌ Cancelar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/navbar.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/perfil.js"></script>
</body>
</html>
